# Azure DevOps pipeline for pyjenkinsapi
#
# Requires:
# - secret variable COPILOT_GITHUB_TOKEN configured in Azure DevOps
# - repo-local .github/copilot-instructions.md

trigger:
  branches:
    include:
      - main
      - pyjenkinsapi-v0.1.0

pr:
  branches:
    include:
      - main
      - pyjenkinsapi-v0.1.0

pool:
  vmImage: ubuntu-latest

variables:
  PYJENKINSAPI_LINT_BACKEND_CMD: ruff
  PYJENKINSAPI_LINT_BACKENDS: py:ruff
  PYJENKINSAPI_REVIEW_MODEL: gpt-5.4-mini
  PYJENKINSAPI_REVIEW_PROMPT: >
    Review this pyjenkinsapi change for correctness, backward compatibility,
    config-driven credential handling, secret handling, and missing tests or docs.
    Prioritize behavior regressions and compatibility risks over style-only comments.

stages:
  - stage: Validate
    displayName: Bootstrap, lint, and review
    jobs:
      - job: pyjenkinsapi_validation
        displayName: pyjenkinsapi validation
        steps:
          - checkout: self
            fetchDepth: 0

          - bash: |
              set -euo pipefail
              cd "$(Build.SourcesDirectory)"
              bin/ai-bootstrap --backend-cmd "$PYJENKINSAPI_LINT_BACKEND_CMD" --install
              user_bin_dir="$(python3 -m site --user-base)/bin"
              echo "##vso[task.prependpath]$user_bin_dir"
              command -v "$PYJENKINSAPI_LINT_BACKEND_CMD" >/dev/null 2>&1
            displayName: Prepare dependencies

          - bash: |
              set -euo pipefail
              cd "$(Build.SourcesDirectory)"
              bin/ai-lint
            displayName: Lint

          - bash: |
              set -euo pipefail
              cd "$(Build.SourcesDirectory)"
              bin/ai-review
            displayName: Review
            env:
              GH_TOKEN: $(COPILOT_GITHUB_TOKEN)
              COPILOT_GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)
              PYJENKINSAPI_REVIEW_MODEL: $(PYJENKINSAPI_REVIEW_MODEL)
              PYJENKINSAPI_REVIEW_PROMPT: $(PYJENKINSAPI_REVIEW_PROMPT)
